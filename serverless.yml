service: shui

frameworkVersion: '4'

useDotenv: true

provider:
  name: aws
  runtime: nodejs22.x
  region: eu-north-1
  stage: dev

  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:PutItem
            - dynamodb:GetItem
            - dynamodb:Query
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
          Resource:
            - !GetAtt PostsTable.Arn
            - !GetAtt UsersTable.Arn
            - !GetAtt CommentsTable.Arn
            - !Sub "${PostsTable.Arn}/index/*"

  # Environment variables shared with Lambda functions.
  # Keeps database table names configurable instead of hardcoding them.
  environment:
    # Name of the DynamoDB Posts table, including the deployment stage.
    POSTS_TABLE: ShuiPosts-${sls:stage}
    USERS_TABLE: ShuiUsers-${sls:stage}
    COMMENTS_TABLE: ShuiComments-${sls:stage}
    JWT_SECRET: ${env:JWT_SECRET}

functions:
  register:
    handler: src/handlers/auth/register.handler
    events:
      - httpApi:
          path: /auth/register
          method: POST

  login:
    handler: src/handlers/auth/login.handler
    events:
      - httpApi:
          path: /auth/login
          method: POST
  
  createPost:
    handler: src/handlers/posts/create.handler
    events:
      - httpApi:
          path: /posts
          method: POST

  getAllPosts:
    handler: src/handlers/posts/getAll.handler
    events:
      - httpApi:
          path: /posts
          method: GET

  getPost:
    handler: src/handlers/posts/getById.handler
    events:
      - httpApi:
          path: /posts/{postId}
          method: GET

  updatePost:
    handler: src/handlers/posts/update.handler
    events:
      - httpApi:
          path: /posts/{postId}
          method: PUT





resources:
  Resources:
    PostsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        # Table name changes depending on the deployment stage.
        TableName: ShuiPosts-${sls:stage}

        # AWS charges based on actual database requests.
        BillingMode: PAY_PER_REQUEST

        # Attributes used by the primary key and secondary indexes.
        AttributeDefinitions:
          - AttributeName: id
            AttributeType: S
          - AttributeName: GSI1PK
            AttributeType: S
          - AttributeName: GSI1SK
            AttributeType: S
          - AttributeName: GSI2PK
            AttributeType: S
          - AttributeName: GSI2SK
            AttributeType: S

        # Primary key: unique identifier for each post.
        KeySchema:
          - AttributeName: id
            KeyType: HASH

        # Additional indexes for retrieving posts efficiently.
        GlobalSecondaryIndexes:
          - IndexName: PostsByDateIndex
            KeySchema:
              - AttributeName: GSI1PK
                KeyType: HASH
              - AttributeName: GSI1SK
                KeyType: RANGE
            Projection:
              ProjectionType: ALL

          - IndexName: PostsByUsernameIndex
            KeySchema:
              - AttributeName: GSI2PK
                KeyType: HASH
              - AttributeName: GSI2SK
                KeyType: RANGE
            Projection:
              ProjectionType: ALL
   
    UsersTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ShuiUsers-${sls:stage}
        BillingMode: PAY_PER_REQUEST

        AttributeDefinitions:
          - AttributeName: username
            AttributeType: S

        KeySchema:
          - AttributeName: username
            KeyType: HASH

    CommentsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ShuiComments-${sls:stage}
        BillingMode: PAY_PER_REQUEST

        AttributeDefinitions:
          - AttributeName: postId
            AttributeType: S
          - AttributeName: commentId
            AttributeType: S

        KeySchema:
          - AttributeName: postId
            KeyType: HASH
          - AttributeName: commentId
            KeyType: RANGE

            